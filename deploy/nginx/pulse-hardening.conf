# PulseHours — nginx hardening fragment
#
# PLACEMENT: include this INSIDE the `location ^~ /pulse/ { ... }` block, BEFORE
# that block's nested `location ~ \.php$` regex:
#
#   location ^~ /pulse/ {
#       auth_request /auth/api/auth/require.php;
#       ...
#       include /etc/nginx/snippets/pulse-hardening.conf;   # <-- here
#
#       location ~ \.php$ { ... }
#   }
#
# Ordering matters: nginx evaluates nested regex locations in definition order,
# so if this is included after the PHP location, /pulse/database/seed.php reaches
# PHP-FPM before any deny rule runs.
#
# Why this exists: the docroot is the repository root, and SSO (auth_request)
# only proves the caller is *some* Veerless user — not an admin. The repo's
# .htaccess files are Apache-only and do nothing under nginx. Without these
# rules every SSO user can execute seeders/migrations and read docs, logs and
# lockfiles.
#
# Paths are matched on the request URI, so the rules work whether the block
# uses root or alias.

# Dotfiles: .git, .env, .gitignore, .cpanel.yml, editor droppings.
location ~ ^/pulse/(?:.*/)?\. {
    deny all;
}

# Library code, config, maintenance scripts, logs and local-dev tooling. None of
# these is ever requested by a browser; PHP only require()s them.
location ~ ^/pulse/(?:config|database|scripts|includes|src|sso|vendor|logs|docker|deploy|tests|auth/include)/ {
    deny all;
}

# Root-level scripts removed from the repo. Docroots are copied, not synced, so
# old copies survive on servers until deleted by hand; keep denying them.
location ~ ^/pulse/(?:create_admin_user|run_seeder|run_migration|check_internal_clients|test_[^/]*)\.(?:php|sql)$ {
    deny all;
}

# Docs, schema, lockfiles, build files and backups.
location ~ ^/pulse/.*\.(?:md|sql|ya?ml|lock|log|ini|sh|conf|dist|bak\d*|old|orig|save|swp)$ {
    deny all;
}

location ~ ^/pulse/(?:composer\.json|Dockerfile)$ {
    deny all;
}

# Uploaded files must never be executed.
location ~ ^/pulse/uploads/.*\.(?:php\d*|phtml|phps|phar|inc|cgi|pl|py|sh|htaccess)$ {
    deny all;
}
